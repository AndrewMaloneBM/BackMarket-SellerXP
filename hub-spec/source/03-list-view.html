<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1760}}'>
class Component extends DCLogic {
  renderVals() {
    const ink = 'hsl(225, 21%, 7%)';
    const neutral = 'hsl(220, 19%, 94%)';
    const tone = {
      'Exploring': { bg: neutral, fg: ink, bd: neutral },
      'Ready to test': { bg: 'hsl(221, 86%, 92%)', fg: 'hsl(219, 27%, 40%)', bd: 'hsl(221, 86%, 92%)' },
      'In testing': { bg: 'hsl(38, 90%, 84%)', fg: 'hsl(42, 75%, 27%)', bd: 'hsl(38, 90%, 84%)' },
      'Tested': { bg: 'hsl(145, 83%, 77%)', fg: 'hsl(156, 100%, 21%)', bd: 'hsl(145, 83%, 77%)' },
      'Shipped': { bg: 'hsl(70, 88%, 73%)', fg: ink, bd: 'hsl(70, 88%, 73%)' }
    };

    const real = [
      { name: 'Home page rethink', pages: 'Home', status: 'Exploring', updated: 'Sep 2026' },
      { name: 'Deals step one', pages: 'Home, Listings, Opportunities', status: 'In testing', updated: 'Sep 2026' },
      { name: 'Proactive seller insights', pages: 'Cross-page', status: 'Exploring', updated: 'Sep 2026' },
      { name: 'Deals adoption', pages: 'Home, Listings', status: 'Exploring', updated: 'Aug 2026' },
      { name: '6-tier risk model', pages: 'Home, Money', status: 'Ready to test', updated: 'Aug 2026' },
      { name: 'Support AI in the Back Office', pages: 'Cross-page', status: 'Exploring', updated: 'May 2026' },
      { name: 'Listings page explorations', pages: 'Listings', status: 'Exploring', updated: 'May 2026' },
      { name: 'BackFunds self-onboarding', pages: 'Home, Money', status: 'Exploring', updated: 'Apr 2026' }
    ];

    const fillerStatus = ['Exploring', 'Exploring', 'Tested', 'Exploring', 'Shipped', 'Exploring', 'Ready to test', 'Exploring'];
    const filler = [];
    for (let i = 0; i < 16; i += 1) {
      filler.push({ name: '[Prototype name]', pages: '[Pages]', status: fillerStatus[i % 8], updated: '[date]', byline: '[Author], [discipline]' });
    }

    const rows = real.concat(filler).map((c) => {
      const t = tone[c.status];
      return {
        name: c.name,
        pagesText: c.pages,
        status: c.status,
        updated: c.updated,
        byline: c.byline || 'Andrew Malone, Design',
        stBg: t.bg,
        stFg: t.fg,
        stBd: t.bd
      };
    });

    return { rows: rows };
  }
}
</script>
